<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e41e26"><title>Rezervační portál lístků | Coca-Cola HBC</title>
<style>
:root{--red:#e41e26;--dark:#181818;--bg:#f5f6f7;--line:#e1e3e5;--muted:#6b6f72}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#222}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px #0000000d}.login-card{width:min(420px,100%);padding:28px}.brand{font-weight:800;color:var(--red);font-size:20px}h1{margin:5px 0 4px;font-size:26px}.muted{color:var(--muted);font-size:14px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd0d4;border-radius:8px;background:#fff}textarea{min-height:90px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700}.primary{background:var(--red);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.danger{background:#fff0ef;color:#a5221b;border:1px solid #efc5c0}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:16px;position:sticky;top:0;z-index:20}.logo{font-weight:900;color:var(--red)}.grow{flex:1}.layout{display:flex;min-height:calc(100vh - 62px)}aside{width:220px;background:var(--dark);padding:15px 10px;color:#fff}.nav button{display:block;width:100%;border:0;background:transparent;color:#ddd;text-align:left;padding:11px 12px;border-radius:7px;margin:3px 0}.nav button:hover,.nav button.active{background:#303030;color:#fff}main{flex:1;padding:25px}.page{max-width:1250px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:17px}.event{overflow:hidden}.event-image{height:150px;background:#ddd center/cover}.event-body{padding:16px}.event h3{margin:7px 0}.meta{font-size:13px;color:#666;line-height:1.55}.actions{display:flex;gap:8px;margin-top:13px}.badge{display:inline-block;background:#f0f1f2;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:700;margin-right:4px}.badge.red{background:#ffe5e7;color:#a40f17}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.table{border-collapse:collapse;width:100%;min-width:780px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}.table th{background:#fafafa}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters>*{min-width:160px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:50}.modal-box{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:50%;width:32px;height:32px}.notice{padding:11px 13px;border-radius:8px;background:#f1f3f4;margin:10px 0;font-size:13px;white-space:pre-line}.bad{background:#fff0ef;color:#9e2118}.ok{background:#e9f7ef;color:#17633d}.empty{text-align:center;padding:35px;color:#777}@media(max-width:750px){aside{width:65px}.nav button{font-size:0;text-align:center}main{padding:14px}.form-grid{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><div class="brand">COCA-COLA HBC</div><h1>Rezervační portál lístků</h1><p class="muted">Přihlášení do interního portálu.</p><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Heslo</label><input id="password" type="password"></div><button class="btn primary" style="width:100%" onclick="login()">Přihlásit</button><div id="loginError" class="notice bad hidden"></div></div></div>
<div id="app" class="hidden"><header class="top"><div class="logo">COCA-COLA HBC</div><b>Rezervační portál lístků</b><div class="grow"></div><span id="who" class="muted"></span><button class="btn secondary" onclick="logout()">Odhlásit</button></header><div class="layout"><aside><div class="nav"><button id="n-home" onclick="tab('home')">Plánované akce</button><button id="n-requests" onclick="tab('requests')">Seznam žádostí</button><button id="n-approved" onclick="tab('approved')">Schválené žádosti</button><hr style="border:0;border-top:1px solid #333;margin:13px 4px"><button id="n-admin" onclick="tab('admin')">Administrace</button><button id="n-users" onclick="tab('users')">Uživatelé</button><button id="n-settings" onclick="tab('settings')">Vzhled</button></div></aside><main><div id="content" class="page"></div></main></div></div>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2 id="mtitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="mbody"></div></div></div><div id="toast" class="notice hidden" style="position:fixed;right:20px;bottom:20px;z-index:100;box-shadow:0 5px 20px #0002"></div>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCPSV3AauKHMPfnkACjbfvEDbb6RFJMiJA",authDomain:"cc-tickets-booking-app.firebaseapp.com",projectId:"cc-tickets-booking-app",storageBucket:"cc-tickets-booking-app.firebasestorage.app",messagingSenderId:"998442761726",appId:"1:998442761726:web:e5bbe201f68c9594ea54af",measurementId:"G-GKKE8GCN0T"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let me=null,profile=null,events=[],requests=[],users=[],categories=[],reasons=[],settings={season:"normal"};const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),date=x=>x?new Date(x+"T00:00:00").toLocaleDateString("cs-CZ"):"";
let booting=false;
auth.onAuthStateChanged(async u=>{if(!u){me=null;profile=null;$("login").classList.remove("hidden");$("app").classList.add("hidden");return}if(booting)return;booting=true;try{await bootstrap(u)}catch(e){console.error("Portal bootstrap error",e);showLoginError(formatFirebaseError(e,u))}finally{booting=false}});
async function bootstrap(u){
  me=u;
  const path="users/"+u.uid;
  let snap;
  try{snap=await db.collection("users").doc(u.uid).get({source:"server"})}
  catch(e){throw new Error("Firebase nedokázal načíst "+path+".\nKód: "+(e.code||"neuveden")+"\n"+(e.message||""))}
  if(!snap.exists){
    // A second direct read is intentionally made only to distinguish a real missing
    // document from a transient client/cache problem.
    try{const retry=await db.collection("users").doc(u.uid).get({source:"server"});if(retry.exists)snap=retry}catch(e){throw e}
  }
  if(!snap.exists)throw new Error("Firebase říká, že dokument "+path+" neexistuje.\nPřihlášené UID: "+u.uid+"\nProjekt aplikace: "+firebase.app().options.projectId);
  profile=snap.data();
  if(profile.active!==true)throw new Error("Účet je nalezen, ale není aktivní (pole active musí být Boolean true).\nUID: "+u.uid);
  $("who").textContent=(profile.name||u.email)+" · "+(profile.role||"user");
  $("login").classList.add("hidden");$("app").classList.remove("hidden");
  await load();tab("home");
}
function formatFirebaseError(e,u){const code=e.code||"neuveden";const msg=e.message||String(e);return "Přihlášení proběhlo, ale portál nedokázal načíst profil.\nKód: "+code+"\nUID: "+(u?.uid||"neuveden")+"\nProjekt: "+firebase.app().options.projectId+"\n\n"+msg}

async function login(){try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(e){showLoginError((e.code||"chyba")+": "+e.message)}}function logout(){auth.signOut()}function showLoginError(t){$("loginError").textContent=t;$("loginError").classList.remove("hidden")}function admin(){return profile?.role==="admin"}function second(){return profile?.role==="secondApprover"}
async function load(){
  const reads=[db.collection("events").get(),db.collection("categories").get(),db.collection("reasons").get(),db.collection("settings").doc("portal").get()];
  // Secure rules do not allow ordinary users to list the entire users or requests collections.
  // Admins/second approvers may see the full request list; ordinary users only see their own.
  reads.push(admin()?db.collection("requests").get():db.collection("requests").where("applicantUid","==",me.uid).get());
  if(admin())reads.push(db.collection("users").get());
  const out=await Promise.all(reads);let i=0;
  const a=out[i++],c=out[i++],rs=out[i++],s=out[i++],r=out[i++];
  events=a.docs.map(d=>({id:d.id,...d.data()}));categories=c.docs.map(d=>({id:d.id,...d.data()}));reasons=rs.docs.map(d=>({id:d.id,...d.data()}));requests=r.docs.map(d=>({id:d.id,...d.data()}));
  if(admin()){const u=out[i++];users=u.docs.map(d=>({id:d.id,...d.data()}));}else users=[{id:me.uid,...profile}];
  if(s.exists)settings={...settings,...s.data()}
}
function tab(t){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));$("n-"+t).classList.add("active");({home,requests:requestList,approved,admin:adminPage,users:usersPage,settings:settingsPage}[t]||home)()}
function home(){$("content").innerHTML='<div class="head"><div><h1>Plánované akce</h1><div class="muted">Vyberte akci pro novou rezervaci.</div></div></div><div class="grid">'+(events.filter(e=>e.status!=="locked"&&e.status!=="cancelled").map(card).join("")||'<div class="card empty">Žádné plánované akce.</div>')+'</div>'}
function card(e){const used=requests.filter(r=>r.eventId===e.id&&r.status==="approved").reduce((n,r)=>n+Number(r.tickets||0),0),free=Math.max(0,Number(e.capacity||0)-used);return `<div class="card event"><div class="event-image" style="${e.imageUrl?`background-image:url('${esc(e.imageUrl)}')`:""}"></div><div class="event-body">${e.category?`<span class="badge red">${esc(e.category)}</span>`:""}<h3>${esc(e.name)}</h3><div class="meta">${date(e.date)}${e.time?" · "+esc(e.time):""}<br>${esc(e.place||"")}<br>Volných lístků: <b>${free}</b></div><div class="actions"><button class="btn primary" onclick="reservation('${e.id}')">Nová rezervace</button>${e.description?`<button class="btn secondary" title="${esc(e.description)}">ⓘ</button>`:""}</div></div></div>`}
function reservation(id){const e=events.find(x=>x.id===id);open("Nová rezervace",`<form onsubmit="saveRequest(event,'${id}')"><div class="form-grid"><div class="field"><label>Akce</label><input value="${esc(e.name)}" disabled></div><div class="field"><label>Žadatel</label><input value="${esc(profile.name||me.email)}" disabled></div><div class="field"><label>Zákazník</label><input id="customer" required></div><div class="field"><label>Obrat (EUR)</label><input id="turnover" type="number" min="0" step=".01"></div><div class="field"><label>Počet lístků</label><input id="tickets" type="number" min="1" value="1" required></div><div class="field full"><label>Důvod</label><textarea id="reason" required>${esc(reasons.find(x=>x.active!==false)?.name||"")}</textarea></div><div class="field full"><label><input id="confirm" type="checkbox" required style="width:auto"> Jsem si vědom/a Kodexu chování a Pravidel chování pro zákazníky.</label></div></div><button class="btn primary">Odeslat žádost</button></form>`)}
async function saveRequest(ev,id){ev.preventDefault();const e=events.find(x=>x.id===id),tickets=Number($("tickets").value),used=requests.filter(r=>r.eventId===id&&r.status==="approved").reduce((n,r)=>n+Number(r.tickets||0),0);if(used+tickets>Number(e.capacity||0)){toast("Nedostatek volných lístků.","bad");return}await db.collection("requests").add({eventId:id,eventName:e.name,applicantUid:me.uid,applicantName:profile.name||me.email,applicantEmail:me.email,customer:$("customer").value.trim(),turnoverEUR:Number($("turnover").value||0),tickets,reason:$("reason").value.trim(),managerUid:profile.managerUid||"",status1:"pending",status2:"pending",status:"pending",approvedBy1:"",approvedBy2:"",createdAt:firebase.firestore.FieldValue.serverTimestamp()});closeModal();await load();home();toast("Žádost odeslána.")}
function requestList(){let rows=requests;if(!admin()&&!second())rows=rows.filter(r=>r.applicantUid===me.uid);$("content").innerHTML='<div class="head"><div><h1>Seznam žádostí</h1><div class="muted">Přehled rezervací a schvalování.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Akce</th><th>Žadatel</th><th>Zákazník</th><th>Lístky</th><th>1.</th><th>2.</th><th>Stav</th><th></th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${esc(r.eventName)}</td><td>${esc(r.applicantName)}</td><td>${esc(r.customer)}</td><td>${r.tickets}</td><td>${r.status1}</td><td>${r.status2}</td><td>${r.status}</td><td><button class="btn secondary" onclick="detail('${r.id}')">Detail</button></td></tr>`).join("")+'</tbody></table></div>'}
function detail(id){const r=requests.find(x=>x.id===id),can1=admin()||r.managerUid===me.uid,can2=admin()||second();open("Detail žádosti",`<div class="notice"><b>${esc(r.eventName)}</b><br>${esc(r.applicantName)} · ${esc(r.customer)} · ${r.tickets} lístků</div><p><b>Důvod:</b> ${esc(r.reason)}</p><p><b>1. schválení:</b> ${r.status1}</p><p><b>2. schválení:</b> ${r.status2}</p><div class="actions">${can1&&r.status1==="pending"?`<button class="btn primary" onclick="approve('${id}',1,true)">Schválit 1</button><button class="btn danger" onclick="approve('${id}',1,false)">Zamítnout 1</button>`:""}${can2&&r.status1==="approved"&&r.status2==="pending"?`<button class="btn primary" onclick="approve('${id}',2,true)">Schválit 2</button><button class="btn danger" onclick="approve('${id}',2,false)">Zamítnout 2</button>`:""}</div>`)}
async function approve(id,step,yes){const p={};p["status"+step]=yes?"approved":"rejected";p["approvedBy"+step]=profile.name||me.email;if(!yes)p.status="rejected";else if(step===2)p.status="approved";await db.collection("requests").doc(id).update(p);closeModal();await load();requestList();toast(yes?"Schváleno.":"Zamítnuto.")}
function approved(){$("content").innerHTML='<div class="head"><div><h1>Schválené žádosti</h1><div class="muted">Schválené rezervace podle akce.</div></div></div>' + ([...new Set(requests.filter(r=>r.status==="approved").map(r=>r.eventName))].map(n=>`<div class="card" style="margin-bottom:14px"><h3>${esc(n)}</h3>${requests.filter(r=>r.status==="approved"&&r.eventName===n).map(r=>`<p>${esc(r.applicantName)} · ${esc(r.customer)} · ${r.tickets} lístků</p>`).join("")}</div>`).join("")||'<div class="card empty">Žádné schválené žádosti.</div>')}
function adminPage(){if(!admin()){$("content").innerHTML='<div class="card empty">Nemáte oprávnění.</div>';return}$("content").innerHTML='<div class="head"><div><h1>Administrace</h1><div class="muted">Správa akcí.</div></div><button class="btn primary" onclick="eventForm()">+ Nová akce</button></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Název</th><th>Kategorie</th><th>Datum</th><th>Kapacita</th><th></th></tr></thead><tbody>'+events.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.category||"")}</td><td>${date(e.date)}</td><td>${e.capacity||0}</td><td><button class="btn secondary" onclick="eventForm('${e.id}')">Upravit</button> <button class="btn danger" onclick="delEvent('${e.id}')">Smazat</button></td></tr>`).join("")+'</tbody></table></div></div>'}
function eventForm(id){if(!admin())return;const e=events.find(x=>x.id===id)||{};open(id?"Upravit akci":"Nová akce",`<form onsubmit="saveEvent(event,'${id||""}')"><div class="form-grid"><div class="field"><label>Název</label><input id="en" value="${esc(e.name)}" required></div><div class="field"><label>Kategorie</label><input id="ec" value="${esc(e.category)}"></div><div class="field"><label>Podkategorie</label><input id="es" value="${esc(e.subcategory)}"></div><div class="field"><label>Datum</label><input id="ed" type="date" value="${esc(e.date)}" required></div><div class="field"><label>Čas</label><input id="et" type="time" value="${esc(e.time)}"></div><div class="field"><label>Místo</label><input id="ep" value="${esc(e.place)}"></div><div class="field"><label>Kapacita</label><input id="cap" type="number" min="1" value="${Number(e.capacity||1)}" required></div><div class="field"><label>Obrázek – URL</label><input id="img" value="${esc(e.imageUrl)}"></div><div class="field full"><label>Popis pro tooltip</label><textarea id="desc">${esc(e.description)}</textarea></div></div><button class="btn primary">Uložit</button></form>`)}
async function saveEvent(ev,id){ev.preventDefault();const d={name:$("en").value.trim(),category:$("ec").value.trim(),subcategory:$("es").value.trim(),date:$("ed").value,time:$("et").value,place:$("ep").value.trim(),capacity:Number($("cap").value),imageUrl:$("img").value.trim(),description:$("desc").value.trim(),status:"active"};if(id)await db.collection("events").doc(id).update(d);else await db.collection("events").add(d);closeModal();await load();adminPage();toast("Akce uložena.")}
async function delEvent(id){if(confirm("Smazat tuto akci?")){await db.collection("events").doc(id).delete();await load();adminPage()}}
function usersPage(){if(!admin()){$("content").innerHTML='<div class="card empty">Nemáte oprávnění.</div>';return}$("content").innerHTML='<div class="head"><div><h1>Uživatelé</h1><div class="muted">Role a aktivita účtů.</div></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Jméno</th><th>E-mail</th><th>Role</th><th>Aktivní</th></tr></thead><tbody>'+users.map(u=>`<tr><td>${esc(u.name||"")}</td><td>${esc(u.email||"")}</td><td><select onchange="role('${u.id}',this.value)"><option ${u.role==="user"?"selected":""}>user</option><option ${u.role==="secondApprover"?"selected":""}>secondApprover</option><option ${u.role==="admin"?"selected":""}>admin</option></select></td><td><input type="checkbox" ${u.active===true?"checked":""} onchange="active('${u.id}',this.checked)" style="width:auto"></td></tr>`).join("")+'</tbody></table></div></div>'}
async function role(id,v){await db.collection("users").doc(id).update({role:v});await load();toast("Role změněna.")}async function active(id,v){await db.collection("users").doc(id).update({active:v});await load();toast("Stav změněn.")}
function settingsPage(){if(!admin()){$("content").innerHTML='<div class="card empty">Nemáte oprávnění.</div>';return}$("content").innerHTML='<div class="head"><div><h1>Vzhled a nastavení</h1><div class="muted">Sezónní režim.</div></div></div><div class="card"><div class="filters"><select id="season"><option>normal</option><option>spring</option><option>summer</option><option>autumn</option><option>winter</option></select><button class="btn primary" onclick="saveSettings()">Uložit</button></div></div>';$("season").value=settings.season||"normal"}
async function saveSettings(){await db.collection("settings").doc("portal").set({season:$("season").value},{merge:true});await load();settingsPage();toast("Nastavení uloženo.")}
function open(t,b){$("mtitle").textContent=t;$("mbody").innerHTML=b;$("modal").classList.remove("hidden")}function closeModal(){$("modal").classList.add("hidden")}function toast(t,c="ok"){const x=$("toast");x.textContent=t;x.className="notice "+c;x.classList.remove("hidden");setTimeout(()=>x.classList.add("hidden"),2500)}
</script></body></html>
