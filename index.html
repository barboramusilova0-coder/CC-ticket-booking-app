.ev:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(25,30,40,.13);border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.ev-img{height:190px;min-height:150px;background-color:var(--bg2);background-position:center;background-size:contain;background-repeat:no-repeat;position:relative;isolation:isolate}
.ev-img:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.13),transparent 28%,transparent 70%,rgba(0,0,0,.10));pointer-events:none;z-index:-1}

.tile{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border:1px solid var(--border);border-radius:var(--r2);background:var(--surface);cursor:pointer;box-shadow:var(--sh1)}

.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate-box{width:min(520px,100%)}.gate-box .card{padding:26px}

dialog{border:1px solid var(--border);border-radius:var(--r2);padding:0;background:var(--surface);color:var(--text);box-shadow:var(--sh2);width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px)}

.chat-q{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}.chat-f{display:flex;gap:8px;padding:10px 12px}
.ob-dots{display:flex;gap:6px;justify-content:center;margin:6px 0}.ob-dots i{width:8px;height:8px;border-radius:50%;background:var(--border)}.ob-dots i.on{background:var(--accent)}
.hide{display:none!important}
</style>

function parseCSV(text){text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/)[0]||'';const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}else cur+=c}
  if(cur!==''||row.length){row.push(cur);if(row.some(x=>x!==''))rows.push(row)}if(!rows.length)return[];const head=rows[0].map(h=>h.trim());return rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=r[i]==null?'':r[i]);return o})}

function imgToData(file,max){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(new Error('read'));r.onload=()=>{const im=new Image();im.onerror=()=>no(new Error('img'));im.onload=()=>{const k=Math.min(1,(max||720)/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)})}

const Res={
  async create(f){const u=S.user;if(!u)throw new Error(T('err.login'));let req,ev0;
    await Cloud.mutate(async(d,tx)=>{const s=await tx.get(Cloud.col.doc(String(f.eventId)));let ev=s.exists?s.data():(d.companyActions||[]).find(a=>String(a.id)===String(f.eventId));if(!ev)throw new Error(T('err.noevent'));

      const st=evStatusWith(ev,ap);if(st!=='Active'||ev.status==='Skryto')throw new Error(T('err.notbookable',{s:T(EVST_L[st]||'ev.archived')}));
      const cap=Number(ev.capacity)||0;if(cap&&f.tickets>cap-ap)throw new Error(T('err.toomany',{n:Math.max(0,cap-ap)}));
      const now=new Date().toISOString();req={id:Date.now(),actionId:ev.id,action:ev.name,employee:f.employee,manager:norm(f.manager),customer:f.customer,tickets:String(f.tickets),reason:f.reason,status1:'Čeká',status2:'Čeká',approvedBy1:'',approvedBy2:'',applicantEmail:norm(u.email),createdAt:now,history:[{ts:now,by:u.email,level:0,value:'created'}]};reqs.push(req);ev0=ev;return{patch:{ticketRequests:reqs}}});
    audit('reservation-created',req.id,req.action+' / '+req.customer+' / '+req.tickets);
    Teams.send('new_reservation',{facts:[[T('tm.f.event'),req.action],[T('tm.f.who'),req.employee],[T('tm.f.customer'),req.customer],[T('tm.f.tickets'),req.tickets]]});return req},
  canL1(r){if(!S.user)return false;if(S.user.role==='admin')return true;if(S.user.role!=='manager')return false;const me=norm(S.user.email);if(norm(r.manager)===me)return true;const today=isoDay(new Date());return Object.values(S.users).some(owner=>{const p=owner.prefs||{};return norm(owner.email)===norm(r.manager)&&norm(p.deputyEmail)===me&&p.deputyFrom&&p.deputyTo&&today>=p.deputyFrom&&today<=p.deputyTo})},
  canL2(r){return S.user&&(S.user.role==='admin'||(S.user.role==='rsm_praha'&&r.status1==='Schváleno'))},
  async decide(id,level,value){const u=S.user;let res,evx;
    await Cloud.mutate(async(d,tx)=>{const reqs=(d.ticketRequests||[]).slice(),i=reqs.findIndex(r=>String(r.id)===String(id));if(i<0)throw new Error(T('err.notfound'));const r=Object.assign({},reqs[i]);
      if(level===1&&!this.canL1(r))throw new Error(T('err.perm'));if(level===2&&!this.canL2(r))throw new Error(T('err.perm2'));
      let ev=null;if(level===2&&value==='Schváleno'){const s=await tx.get(Cloud.col.doc(String(r.actionId!=null&&r.actionId!==''?r.actionId:'_')));ev=s.exists?s.data():(d.ticketRequests?null:null);if(!ev)ev=(S._all||[]).find(e=>(r.actionId!=null&&r.actionId!==''?String(e.id)===String(r.actionId):e.name===r.action))||null;
        if(ev){const cap=Number(ev.capacity)||0;if(cap){const ap=reqs.filter((x,j)=>j!==i&&overall(x)==='approved'&&(x.actionId!=null&&x.actionId!==''?String(x.actionId)===String(ev.id):x.action===ev.name)).reduce((n,x)=>n+(parseInt(x.tickets)||0),0);if(ap+(parseInt(r.tickets)||0)>cap)throw new Error(T('err.capacity',{n:Math.max(0,cap-ap)}))}}}

  visible(){const u=S.user;if(!u)return[];const me=norm(u.email);if(u.role==='applicant')return S.requests.filter(r=>r.applicantEmail?norm(r.applicantEmail)===me:norm(r.employee)===norm(u.name));if(u.role==='manager')return S.requests.filter(r=>norm(r.manager)===me);return S.requests.slice()},

   Plánovač Teams (běží v prohlížeči přihlášeného admina – bez serverové funkce
   nelze zaručit odeslání, když nikdo není přihlášen)
   ===================================================================== */
const Sched={timer:0,
  async claim(ev,sendKey,allKeys){if(ev._legacy||!navigator.onLine||!Cloud.col)return false;let got=false;
    await Cloud.db.runTransaction(async tx=>{const ref=Cloud.col.doc(String(ev._doc||ev.id)),s=await tx.get(ref);if(!s.exists)return;const n=Object.assign({},s.data().notified||{});if(n[sendKey])return;got=true;(allKeys||[sendKey]).forEach(k=>n[k]=true);tx.set(ref,{notified:n},{merge:true})});return got},
  async capacityAlerts(ev){try{if(ev._legacy||!ev.capacity)return;const st=evStatus(ev),rem=evRemaining(ev),cap=Number(ev.capacity);
      if(st==='Full'){if(await this.claim(ev,'full',['full','low']))Teams.send('full_capacity',{facts:evFacts(ev).concat([[T('tm.f.note'),T('tm.fullnote')]])})}
      else if(st==='Active'&&rem!=null&&rem<=Math.max(3,Math.ceil(cap*.1))){if(await this.claim(ev,'low'))Teams.send('low_capacity',{facts:evFacts(ev).concat([[T('tm.f.remaining'),rem]])})}}catch(e){logError('sched',e.message)}},
  async run(){if(!isAdmin()||!S.teams.info&&!S.teams.admin||!S.ready)return 0;let sent=0;const now=new Date();
    for(const ev of S.events){try{if(isArchived(ev)||ev.status==='Zrušena')continue;const t=evTime(ev);if(!t)continue;const ms=t-now;
      if(ms<=0){if(-ms<2*DAY&&await this.claim(ev,'completed')){Teams.send('completed',{facts:evFacts(ev).concat([[T('tm.f.approved'),evStats(ev).approved]])});sent++}continue}
      const ths=[[30,'d30'],[14,'d14'],[7,'d7'],[1,'d1']];let hit=null;for(const x of ths)if(ms<=x[0]*DAY){hit=x}
      if(hit){const larger=ths.filter(x=>x[0]>=hit[0]).map(x=>x[1]);if(await this.claim(ev,hit[1],larger)){Teams.send('reminder_'+hit[0],{facts:evFacts(ev).concat([[T('tm.f.remaining'),evRemaining(ev)==null?'–':evRemaining(ev)]])});sent++}}
      await this.capacityAlerts(ev)}catch(e){logError('sched',e.message)}}return sent},
  start(){clearInterval(this.timer);if(!isAdmin())return;setTimeout(()=>this.run(),4000);this.timer=setInterval(()=>this.run(),15*60*1000)}};

const stBadge=v=>`<span class="badge ${({'Schváleno':'b-ok','Zamítnuto':'b-bad','Náhradník':'b-info','Čeká':'b-warn'})[v]||''}">${esc(T(STAT_L[v]||'st.pending'))}</span>`;
function evCard(ev,o){o=o||{};const st=evStatus(ev),s=evStats(ev),cap=Number(ev.capacity)||0,rem=evRemaining(ev),pct=cap?Math.min(100,Math.round(s.approved/cap*100)):0;
  const low=st==='Active'&&cap&&rem<=Math.max(3,Math.ceil(cap*.1));const img=ev.image||ev.imageUrl||ev.backgroundImage||'';const can=evBookable(ev)&&S.user;
  return `<article class="ev ${st==='Cancelled'||st==='Completed'?'dim':''}" ${ev.description?'data-tip="'+esc(ev.description)+'" tabindex="0" aria-label="'+esc(ev.name)+'"':''}><div class="ev-img" style="${img?'background-image:url(&quot;'+esc(img)+'&quot;)':'background-image:var(--hero)'}" role="img" aria-label="${esc(ev.name)}">${evBadge(st)}${ev.category?'<span class="badge cat">'+esc(ev.category)+'</span>':''}</div>
  <div class="ev-body"><h3>${esc(ev.name)}</h3>
  <div class="ev-meta"><span>📅 ${esc(fmtDate(ev.date,ev.time))}</span>${ev.place?'<span>📍 '+esc(ev.place)+'</span>':''}</div>
  ${cap?`<div><div class="bar ${st==='Full'?'full':low?'low':''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><div class="hint">${T('ev.cap',{a:s.approved,c:cap})}${low?' · <b>'+T('ev.remaining',{n:rem})+'</b>':''}</div></div>`:''}
  <div class="ev-foot">${o.admin?`<button class="btn sm" data-act="evEdit" data-id="${esc(ev.id)}">${T('c.edit')}</button>`:`<button class="btn pri sm" data-act="reserveFor" data-id="${esc(ev.id)}" ${can?'':'disabled'}>${T(st==='Active'?'ev.reserve':st==='Full'?'ev.full':'ev.na')}</button>`}</div></div></article>`}

    <div class="fg"><label for="x-emp">${T('rs.applicant')} *</label><input id="x-emp" type="text" value="${esc(u.name)}" required></div>
    <div class="fg"><label for="x-mgr">${T('rs.manager')} *</label><input id="x-mgr" type="email" value="${esc(defaultMgr)}" placeholder="${esc(defaultMgr||'Nastavte v Nastavení')}" readonly required aria-readonly="true"></div>
    <div class="grid g2"><div class="fg"><label for="x-cu">${T('rs.customer')} *</label><input id="x-cu" type="text" required></div><div class="fg"><label for="x-n">${T('rs.tickets')} *</label><input id="x-n" type="number" min="1" max="10" value="1" required></div></div>
    ${S.reasons.length?`<div class="fg"><label for="x-rs">${T('rs.reasonCat')}</label><select id="x-rs"><option value="">${T('rs.pickReason')}</option>${S.reasons.map(r=>`<option>${esc(r)}</option>`).join('')}</select></div>`:''}

    <button class="btn pri" id="x-send" type="submit" disabled>${T('rs.send')}</button></form></div>`},

  settings(){const u=S.user,pr=(S.users[norm(u.email)]||{}).prefs||{},mgrs=Object.values(S.users).filter(x=>x.role==='manager'||x.role==='rsm_praha');return `<h2>${T('nav.settings')}</h2><div class="grid g2"><section class="card"><h3>${T('set.profile')}</h3><p class="muted small">${esc(u.name)} · ${esc(u.email)}</p><form data-form="settings"><div class="fg"><label for="st-mgr">${T('rs.manager')}</label><input id="st-mgr" type="email" list="st-mgr-list" autocomplete="off" value="${esc(pr.managerEmail||'')}" placeholder="Začněte psát jméno nebo e-mail…"><datalist id="st-mgr-list">${mgrs.map(m=>`<option value="${esc(m.email)}" label="${esc(m.name)}"></option>`).join('')}</datalist><p class="hint">${T('set.managerHint')}</p></div><div class="fg"><label for="st-old">${T('set.currentPw')}</label><input id="st-old" type="password" autocomplete="current-password"></div><div class="fg"><label for="st-pw">${T('set.newPw')}</label><input id="st-pw" type="password" autocomplete="new-password"></div><div class="fg"><label for="st-pw2">${T('f.pw2')}</label><input id="st-pw2" type="password" autocomplete="new-password"></div><button class="btn pri" type="submit">${T('c.save')}</button></form></section><section class="card"><h3>${T('set.deputy')}</h3><p class="hint">${T('set.deputyHint')}</p><div class="fg"><label for="st-dep">${T('set.deputyEmail')}</label><select id="st-dep"><option value="">—</option>${mgrs.map(m=>`<option value="${esc(m.email)}" ${norm(pr.deputyEmail)===norm(m.email)?'selected':''}>${esc(m.name)} (${esc(m.email)})</option>`).join('')}</select></div><div class="grid g2"><div class="fg"><label for="st-from">${T('set.from')}</label><input id="st-from" type="date" value="${esc(pr.deputyFrom||'')}"></div><div class="fg"><label for="st-to">${T('set.to')}</label><input id="st-to" type="date" value="${esc(pr.deputyTo||'')}"></div></div><button class="btn pri" data-act="settingsSave">${T('c.save')}</button></section></div>`},
  requests(){const list=Res.visible().filter(r=>Res.match(r,S.reqFilter)).sort((a,b)=>b.id-a.id);const role=roleOf();
    const chips=[['all','c.all'],['pending','st.pending'],['approved','st.approved'],['rejected','st.rejected']];if(role==='manager')chips.push(['wait1','dash.waiting']);if(role==='rsm_praha')chips.push(['wait2','dash.waitfinal']);

      const mail=isAdmin()&&r.applicantEmail?`<a class="btn sm" href="mailto:${esc(r.applicantEmail)}?subject=${encodeURIComponent(T('rq.mailSubj',{e:r.action}))}&body=${encodeURIComponent(T('rq.mailBody',{e:r.action,a:T(STAT_L[r.status1]),b:T(STAT_L[r.status2])}))}">✉</a>`:'';

      <td data-l="" class="nowrap"><button class="btn sm" data-act="reqInfo" data-id="${r.id}">${T('rq.history')}</button> ${mail} ${del}</td></tr>`}).join('');
    return `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">${role==='applicant'?T('rq.mine'):T('rq.title')}</h2><div class="right row"><input type="search" id="rq-q" placeholder="${T('c.search')}" style="width:200px" aria-label="${T('c.search')}"><button class="btn sm" data-act="expReq" data-f="csv">CSV</button><button class="btn sm" data-act="expReq" data-f="xlsx">Excel</button></div></div>
    <div class="chips" style="margin-bottom:12px">${chips.map(c=>`<button class="chip ${S.reqFilter===c[0]?'on':''}" data-act="reqFilter" data-v="${c[0]}">${T(c[1])}</button>`).join('')}</div>
    ${list.length?`<div class="tw"><table class="stack" id="rq-table"><thead><tr><th>${T('rq.event')}</th><th>${T('rq.applicant')}</th><th>${T('rq.customer')}</th><th>${T('rq.l1')}</th><th>${T('rq.l2')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">${T('rq.none')}</div>`}`},

  dashboard(){const role=roleOf(),mine=Res.visible(),cnt=f=>mine.filter(r=>Res.match(r,f)).length;
    const k=(n,label,filter,page)=>`<button class="kpi" data-act="${page?'adminGo':'goReq'}" data-v="${esc(page||filter)}"><b>${n}</b><span>${esc(label)}</span></button>`;let body='';
    if(role==='applicant')body=k(mine.length,T('dash.my'),'all')+k(cnt('approved'),T('st.approved'),'approved')+k(cnt('rejected'),T('st.rejected'),'rejected')+k(cnt('pending'),T('st.pending'),'pending');
    else if(role==='manager')body=k(cnt('wait1'),T('dash.waiting'),'wait1')+k(cnt('processed1'),T('dash.processed'),'processed1')+k(cnt('appr1me'),T('dash.apprme'),'appr1me')+k(cnt('rej1me'),T('dash.rejme'),'rej1me');
    else if(role==='rsm_praha')body=k(cnt('wait2'),T('dash.waitfinal'),'wait2')+k(cnt('done2'),T('dash.reviews'),'done2');
    else{const ev=S._all||[],c=st=>ev.filter(e=>!isArchived(e)&&evStatus(e)===st).length;body=k(c('Active')+'/'+c('Full')+'/'+c('Cancelled'),T('dash.events'),'','events')+k(S.requests.length,T('dash.reservations'),'','requests')+k(S.roleRequests.length,T('dash.registrations'),'','users')+k(S.errors.length,T('dash.health'),'','system')}
    let extra='';if(role==='admin'){const top=(S._all||[]).filter(e=>!isArchived(e)&&e.capacity&&['Active','Full'].includes(evStatus(e))).sort((a,b)=>evStats(b).approved/b.capacity-evStats(a).approved/a.capacity).slice(0,6);
      extra=`<div class="card" style="margin-top:16px"><h3>${T('dash.capacity')}</h3>${top.length?top.map(e=>{const s=evStats(e),p=Math.min(100,Math.round(s.approved/e.capacity*100));return `<div style="margin:10px 0"><div class="row"><b>${esc(e.name)}</b><span class="muted small right">${s.approved}/${e.capacity} (${p} %)</span></div><div class="bar ${p>=100?'full':p>=85?'low':''}"><i style="width:${p}%"></i></div></div>`}).join(''):'<p class="muted">'+T('ev.none')+'</p>'}</div>`}
    const recent=mine.slice().sort((a,b)=>b.id-a.id).slice(0,5);
    return `<h2>${T('nav.dashboard')}</h2><div class="grid g4">${body}</div>${extra}${role!=='admin'?`<div class="card" style="margin-top:16px"><h3>${T('dash.recent')}</h3>${recent.length?recent.map(r=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--border)"><b>${esc(r.action)}</b><span class="muted small">${esc(r.customer)}</span><span class="right">${stBadge(overall(r)==='approved'?'Schváleno':overall(r)==='rejected'?'Zamítnuto':'Čeká')}</span></div>`).join(''):'<p class="muted">'+T('rq.none')+'</p>'}</div>`:''}`}
};

/* ---------- akce (data-act) ---------- */
Object.assign(ACT,{
  gate:d=>{S.gateMode=d.m;render(true)},lang:d=>Auth.savePrefs({lang:d.v}),
  theme:()=>{const o=['auto','light','dark'],c=themePref();Auth.savePrefs({theme:o[(o.indexOf(c)+1)%3]})},
  nav:d=>{S.view=d.v;history.replaceState(null,'','#'+d.v);render(true);scrollTo(0,0)},
  logout:()=>Auth.logout(),settingsSave(){const email=norm(S.user.email),dep=norm($('#st-dep').value),from=$('#st-from').value,to=$('#st-to').value;if((dep||from||to)&&(!dep||!from||!to||from>to)){toast('Vyberte zástupce a platný rozsah dat.','err');return}return run(()=>Cloud.mutate(d=>{const users=Object.assign({},d.users||{}),u=Object.assign({},users[email]||{}),prefs=Object.assign({},u.prefs||{},{deputyEmail:dep,deputyFrom:from,deputyTo:to});u.prefs=prefs;users[email]=u;return{patch:{users}}}),T('c.saved')).then(()=>render(true))},filter:d=>{S.filter=d.v;render(true)},reqFilter:d=>{S.reqFilter=d.v;render(true)},
  goReq:d=>{S.reqFilter=d.v;S.view='requests';render(true)},adminGo:d=>{S.adminPage=d.v;S.view='admin';render(true)},
  reserveFor:d=>{S.reserveEvent=d.id;S.view='reserve';history.replaceState(null,'','#reserve');render(true);scrollTo(0,0)},
  async decide(d){const lbl=d.v==='Schváleno'?T('c.yes'):d.v==='Zamítnuto'?T('c.no'):T('st.waitlist');if(d.v==='Zamítnuto'&&!await ask(T('rq.confirmRej'),T('c.no'),true))return;await run(()=>Res.decide(d.id,+d.l,d.v),lbl+' ✓')},
  async reqDel(d){if(await ask(T('rq.confirmDel'),T('c.delete'),true))await run(()=>Res.remove(d.id),T('c.deleted'))},
  reqInfo(d){const r=S.requests.find(x=>String(x.id)===String(d.id));if(!r)return;const h=(r.history||[]).map(x=>`<li><b>${esc(fmtTs(x.ts))}</b> – ${esc(x.by)} · ${x.level===0?T('rq.created'):T('rq.level')+' '+x.level+': '+esc(T(STAT_L[x.value]||'st.pending'))}</li>`).join('');

const DOC_KEYS=['ticketRequests','users','roleRequests','customUsers','ccPortalConfigV3','ccManagerProfiles','ccSeasonMode','cc_dynamic_reasons','teamsWebhookUrl','teamsInfoWebhookUrl','teamsNotificationPrefs','teamsLang','auditRetentionDays'];
async function restoreBackup(file){let j;try{j=JSON.parse(await file.text())}catch(e){throw new Error(T('err.json'))}
  const doc=j.doc||j;const events=Array.isArray(j.events)?j.events:(Array.isArray(doc.companyActions)?doc.companyActions:[]);
  if(!DOC_KEYS.some(k=>doc[k]!==undefined)&&!events.length)throw new Error(T('err.json'));
  if(!await ask(T('bk.confirm',{r:(doc.ticketRequests||[]).length,e:events.length,u:Object.keys(doc.users||{}).length}),T('sy.restore'),true))return false;
  await ACT.bkExport();const patch={};DOC_KEYS.forEach(k=>{if(doc[k]!==undefined)patch[k]=doc[k]});if(Object.keys(patch).length)await Cloud.patch(patch);
  for(let i=0;i<events.length;i+=400){const b=Cloud.db.batch();events.slice(i,i+400).forEach(e=>{if(e&&e.id!=null){const o=Object.assign({},e);delete o._doc;delete o._legacy;b.set(Cloud.col.doc(String(e.id)),o)}});await b.commit()}
  audit('backup-restore','',events.length+' events');return true}
async function importEvents(file){let rows=[];const n=file.name.toLowerCase();
  if(n.endsWith('.json')){const j=JSON.parse(await file.text());rows=Array.isArray(j)?j:(j.events||[])}else if(n.endsWith('.csv'))rows=parseCSV(await file.text());else rows=await XL.read(file);
  const pick=(r,keys)=>{for(const k in r){if(keys.includes(k.toLowerCase().trim()))return String(r[k]).trim()}return''};
  const toIso=s=>{s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+'-'+pad(m[1])+'-'+pad(m[2]);return''};
  const exist=new Set((S._all||[]).map(e=>norm(e.name)+'|'+e.date));let ok=0,skip=0,base=Date.now();
  for(const r of rows){const name=pick(r,['name','název','nazev','akce','event','event name']),date=toIso(pick(r,['date','datum']));if(!name||!date){skip++;continue}if(exist.has(norm(name)+'|'+date)){skip++;continue}
    await Cloud.saveEvent({id:base+ok,name,date,time:(pick(r,['time','čas','cas'])||'').slice(0,5),place:pick(r,['place','místo','misto','location']),capacity:parseInt(pick(r,['capacity','kapacita']))||0,category:pick(r,['category','kategorie']),description:pick(r,['description','popis']),image:pick(r,['image','obrázek','obrazek','image url']),status:'Aktivní',createdAt:new Date().toISOString(),importedFrom:file.name});ok++}
  audit('events-import','',file.name+': '+ok+' ok, '+skip+' skip');return{ok,skip}}


function parseWebEvent(html,url){
  const doc=new DOMParser().parseFromString(String(html||''),'text/html');
  const texts=doc.querySelectorAll('script[type="application/ld+json"]');let candidates=[];
  const walk=x=>{if(!x)return;if(Array.isArray(x)){x.forEach(walk);return}if(typeof x!=='object')return;if(x['@graph'])walk(x['@graph']);const typ=Array.isArray(x['@type'])?x['@type']:[x['@type']];if(typ.some(t=>/event/i.test(String(t||''))))candidates.push(x);if(x.itemListElement)walk(x.itemListElement)};
  texts.forEach(t=>{try{walk(JSON.parse(t.textContent))}catch(e){}});
  const ev=candidates[0]||{};const meta=(sel)=>{const e=doc.querySelector(sel);return e?(e.getAttribute('content')||'').trim():''};
  const val=(...xs)=>xs.find(x=>x!=null&&String(x).trim()!=='')||'';
  const start=val(ev.startDate,meta('meta[property="event:start_time"]'),meta('meta[name="startDate"]'));
  const dt=String(start).match(/^(\d{4}-\d\d-\d\d)(?:T(\d\d:\d\d))/);
  let place='';const loc=ev.location;if(typeof loc==='string')place=loc;else if(loc&&typeof loc==='object'){const addr=loc.address;place=val(loc.name,typeof addr==='string'?addr:'',addr&&[addr.streetAddress,addr.addressLocality,addr.addressRegion].filter(Boolean).join(', '))}
  const img=typeof ev.image==='string'?ev.image:Array.isArray(ev.image)?(typeof ev.image[0]==='string'?ev.image[0]:ev.image[0]&&ev.image[0].url):ev.image&&ev.image.url;
  const date=dt?dt[1]:'';const time=dt?dt[2]:(start?String(start).match(/T(\d\d:\d\d)/)?.[1]||'':'');
  let image=val(img,meta('meta[property="og:image"]'),doc.querySelector('link[rel="image_src"]')?.href);try{if(image)image=new URL(image,url||location.href).href}catch(e){}
  return {name:val(ev.name,meta('meta[property="og:title"]'),doc.querySelector('h1')?.textContent,doc.title).trim(),date,time,place,description:val(ev.description,meta('meta[property="og:description"]'),meta('meta[name="description"]')).trim(),image,source:url||location.href};
}
function openWebEventImport(){
  const body=`<div class="fg"><label for="web-ev-url">Adresa stránky akce</label><input id="web-ev-url" type="url" placeholder="https://…" autocomplete="url"><div class="hint">Načte se název, datum, místo, popis a obrázek, pokud je web poskytuje.</div></div><div class="row" style="margin-bottom:12px"><button type="button" class="btn sm" id="web-ev-load">Načíst údaje z webu</button><span class="hint" id="web-ev-status"></span></div><details style="margin-bottom:12px"><summary class="small">Pokročilé: vložit zdrojový HTML kód stránky</summary><textarea id="web-ev-html" placeholder="Volitelně vlož HTML stránky, pokud web blokuje načtení z prohlížeče."></textarea></details><div class="grid g2"><div class="fg"><label for="web-ev-name">Název akce *</label><input id="web-ev-name" type="text" required></div><div class="fg"><label for="web-ev-date">Datum *</label><input id="web-ev-date" type="date" required></div><div class="fg"><label for="web-ev-time">Čas</label><input id="web-ev-time" type="time"></div><div class="fg"><label for="web-ev-place">Místo</label><input id="web-ev-place" type="text"></div><div class="fg"><label for="web-ev-cap">Kapacita</label><input id="web-ev-cap" type="number" min="0" value="0"></div><div class="fg"><label for="web-ev-image">URL obrázku</label><input id="web-ev-image" type="url" placeholder="https://…"></div><div class="fg" style="grid-column:1/-1"><label for="web-ev-desc">Popis</label><textarea id="web-ev-desc"></textarea></div></div><p class="hint">Před uložením údaje zkontroluj. Import vytvoří novou akci a neprovádí rezervaci.</p>`;
  const d=dlg('Import akce z webu',body,[{label:T('c.cancel')},{label:'Importovat akci',cls:'pri',fn:async dd=>{const f={name:$('#web-ev-name',dd).value.trim(),date:$('#web-ev-date',dd).value,time:$('#web-ev-time',dd).value,place:$('#web-ev-place',dd).value.trim(),capacity:$('#web-ev-cap',dd).value,description:$('#web-ev-desc',dd).value.trim(),image:$('#web-ev-image',dd).value.trim(),status:'Aktivní'};if(!f.name||!f.date){toast('Doplň název a datum akce.','err');return false}const ok=await run(async()=>{const ev=await Events.save(f,null);audit('events-web-import',String(ev.id),$('#web-ev-url',dd).value.trim());return ev},'Akce byla importována.');if(!ok)return false;S.adminPage='events';S.view='admin';setTimeout(()=>render(true),0);return true}}]);
  $('#web-ev-load',d).onclick=async()=>{const url=$('#web-ev-url',d).value.trim(),html=$('#web-ev-html',d).value.trim(),status=$('#web-ev-status',d);let source=html;
    if(!source){if(!url){status.textContent='Nejprve vlož adresu stránky.';return}try{const u=new URL(url);if(u.protocol!=='https:'&&u.protocol!=='http:')throw new Error('Použij HTTP nebo HTTPS adresu.');status.textContent='Načítám…';const r=await fetch(u.href,{credentials:'omit'});if(!r.ok)throw new Error('HTTP '+r.status);source=await r.text()}catch(e){status.textContent='Web blokuje přímé načtení (CORS) nebo není dostupný. Vlož zdrojový HTML kód stránky do rozbalovacího pole níže. ';return}}
    try{const x=parseWebEvent(source,url);$('#web-ev-name',d).value=x.name||'';$('#web-ev-date',d).value=x.date||'';$('#web-ev-time',d).value=x.time||'';$('#web-ev-place',d).value=x.place||'';$('#web-ev-desc',d).value=x.description||'';$('#web-ev-image',d).value=x.image||'';status.textContent=x.name?'Údaje načteny. Zkontroluj je a klikni na Importovat akci.':'Nenašel jsem údaje o akci; doplň je ručně.'}catch(e){status.textContent='Stránku se nepodařilo zpracovat; údaje můžeš doplnit ručně.'}
  };
}

'bot.f.reserve':['Novou rezervaci vytvoříte v záložce „Nová rezervace“: vyberte akci, vyplňte údaje, potvrďte Kodex chování a odešlete. Rezervovat lze jen aktivní akce, které ještě neproběhly.','Create a reservation in the “New reservation” tab: pick an event, fill in the details, accept the Code of Conduct and submit. Only active events that have not happened yet can be booked.'],'bot.f.status':['Stav žádostí uvidíte v „Seznam žádostí“. Žádost schvaluje nejdřív 1. stupeň (váš nadřízený) a poté RSM Praha. Kliknutím na „Historie“ uvidíte průběh.','Check your requests in “Requests”. Level 1 (your manager) approves first, then RSM Praha. Click “History” to see the progress.'],'bot.f.access':['O přístup požádáte na úvodní obrazovce tlačítkem „Požádat o přístup“. Žádost schvaluje administrátor.','Request access on the start screen with “Request access”. An administrator approves it.'],'bot.f.login':['Přihlásíte se e-mailem a heslem zadaným při registraci. Heslo vám může znovu nastavit administrátor.','Sign in with the e-mail and password from registration. An administrator can reset your password.'],'bot.f.full':['Když schválené lístky dosáhnou kapacity, akce se automaticky označí jako „Obsazeno“ a nové rezervace jsou zablokované.','When approved tickets reach capacity, the event is automatically marked “Full” and new reservations are blocked.'],'bot.f.cancel':['Zrušené akce nelze rezervovat. Zůstávají v historii a v administraci.','Cancelled events cannot be booked. They remain in history and administration.'],'bot.f.trouble':['Zkontrolujte připojení (vpravo nahoře je stav synchronizace). Pomůže obnovit stránku. Pokud potíže přetrvají, použijte „Nahlásit administrátorovi“.','Check your connection (sync status is at the top right). Reloading the page helps. If the problem persists, use “Report to administrator”.'],'bot.f.install':['Aplikaci nainstalujete přes ikonu instalace v adresním řádku prohlížeče (PC/Android) nebo „Přidat na plochu“ (iPhone/iPad).','Install the app via the install icon in the browser address bar (PC/Android) or “Add to Home Screen” (iPhone/iPad).'],
'ob.title':['Průvodce','Guided tour'],'ob.adminEnabled':['Průvodce je zapnutý','Guided tour enabled'],'ob.adminAuto':['Automaticky zobrazit při prvním přihlášení','Show automatically on first sign-in'],'ob.adminHint':['Upravte texty a zapínání jednotlivých kroků níže. Změny se ukládají do konfigurace portálu.','Edit the text and enablement of each step below. Changes are saved to the portal configuration.'],'ob.adminSteps':['Kroky průvodce','Guided tour steps'],'ob.adminTitle':['Nadpis kroku','Step title'],'ob.adminText':['Text kroku','Step text'],'ob.adminReset':['Obnovit výchozí nastavení','Reset to defaults'],'ob.skip':['Přeskočit','Skip'],'ob.next':['Další','Next'],'ob.finish':['Hotovo','Done'],'ob.restart':['Spustit průvodce znovu','Restart guided tour'],'ob.welcome':['Vítejte v portálu','Welcome to the portal'],'ob.welcomeT':['Tady žádáte o lístky na firemní akce a sledujete jejich schvalování.','Request tickets for company events and track their approval here.'],'ob.nav':['Navigace','Navigation'],'ob.navT':['Záložky nahoře: seznam akcí, nová rezervace, žádosti a přehled. Jazyk a vzhled změníte v záhlaví.','Tabs at the top: events, new reservation, requests and dashboard. Change language and theme in the header.'],
'ob.a1':['Jak požádat o lístky','How to request tickets'],'ob.a1T':['Na seznamu akcí zvolte „Rezervovat“, vyplňte zákazníka, počet lístků a důvod a potvrďte Kodex chování.','On the events list choose “Reserve”, fill in the customer, ticket count and reason, and accept the Code of Conduct.'],'ob.a2':['Sledování stavu','Tracking status'],'ob.a2T':['V „Seznam žádostí“ uvidíte stav 1. i 2. stupně a historii každé žádosti.','In “Requests” you see level 1 and 2 status and the history of each request.'],
'ob.m1':['Schvalování – 1. stupeň','Approval – level 1'],'ob.m1T':['Vidíte žádosti, u kterých jste uveden jako nadřízený. Tlačítky Ano/Ne rozhodnete.','You see requests that name you as manager. Decide with Yes/No.'],'ob.m2':['Přehled a filtry','Dashboard and filters'],'ob.m2T':['Dlaždice v Přehledu vás rovnou přenesou na odpovídající žádosti.','Dashboard tiles take you straight to the matching requests.'],'ob.r1':['Schvalování – 2. stupeň','Approval – level 2'],'ob.r1T':['Finálně schvalujete žádosti potvrzené 1. stupněm. Při plné kapacitě použijte „Náhradník“.','You give final approval to requests confirmed by level 1. When capacity is full use “Waitlist”.'],
'ob.d1':['Administrace','Administration'],'ob.d1T':['Záložka Administrace obsahuje akce, žádosti, uživatele, audit, Teams, vzhled i zálohy.','The Administration tab contains events, requests, users, audit, Teams, appearance and backups.'],'ob.d2':['Akce a stavy','Events and statuses'],'ob.d2T':['Stavy se počítají automaticky: Aktivní, Obsazeno, Zrušeno, Proběhlo. Proběhlé akce najdete v „Dokončené akce“.','Statuses are automatic: Active, Full, Cancelled, Completed. Past events are in “Completed events”.'],'ob.d3':['Teams a záloha','Teams and backup','' ],'ob.d3T':['Nastavte dva webhooky v „Teams notifikace“ a pravidelně stahujte zálohu v „Systém a záloha“.','Set the two webhooks under “Teams notifications” and download a backup regularly under “System and backup”.'],

/* =====================================================================
   CHYTRÝ POMOCNÍK = chatbot + onboarding průvodce (jeden modul)
   ===================================================================== */
const Bot={open:false,hist:[],last:'',
  faq(){const cs=S.lang!=='en';const base=[
    {keys:['rezerv','lístek','listek','vstupenk','ticket','book','reserv'],a:T('bot.f.reserve')},{keys:['schval','stav','status','approv','pending','čeká'],a:T('bot.f.status')},{keys:['přístup','pristup','registr','role','access','register'],a:T('bot.f.access')},
    {keys:['heslo','přihlás','prihlas','password','login','sign in'],a:T('bot.f.login')},{keys:['plná','plne','full','kapacit','capacity','vyprod'],a:T('bot.f.full')},{keys:['zruš','zrus','cancel'],a:T('bot.f.cancel')},{keys:['offline','nefunguje','chyba','error','problém','problem','sync'],a:T('bot.f.trouble')},{keys:['instal','aplikac','pwa','install'],a:T('bot.f.install')}];return base},
  answer(q){const t=norm(q);if(!t)return null;
    const custom=S.cfg.help.answers.map(a=>{const keys=(a.keys||[]).concat(String(a.q||a.title||'').toLowerCase().split(/\s+/).filter(w=>w.length>4));let sc=0;keys.forEach(k=>{if(k&&t.includes(String(k).toLowerCase()))sc+=String(k).length});return{a,sc}}).filter(x=>x.sc>0).sort((x,y)=>y.sc-x.sc)[0];
    if(custom)return{text:String(custom.a.a||custom.a.answer||''),next:(custom.a.next||[]).map(id=>S.cfg.help.answers.find(x=>x.id===id)).filter(Boolean)};
    const byName=(S._all||[]).filter(e=>!isArchived(e)&&t.length>3&&norm(e.name).split(/\s+/).some(w=>w.length>3&&t.includes(w)));if(byName.length&&!/rezerv|book|reserv/.test(t))return{text:byName.slice(0,3).map(e=>{const st=evStatus(e),r=evRemaining(e);return '• '+e.name+' — '+fmtDate(e.date,e.time)+(e.place?', '+e.place:'')+' ['+T(EVST_L[st])+(r!=null&&st==='Active'?', '+T('ev.remaining',{n:r}):'')+']'}).join('\n')};
    if(/akc[ei]|events?|programme|program|kdy|when|nadcház|upcoming/.test(t)){const up=(S._all||[]).filter(e=>evStatus(e)==='Active'||evStatus(e)==='Full').sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,5);return{text:up.length?T('bot.upcoming')+'\n'+up.map(e=>'• '+e.name+' — '+fmtDate(e.date,e.time)+' ['+T(EVST_L[evStatus(e)])+']').join('\n'):T('ev.none')}}
    let best=null,bs=0;this.faq().forEach(f=>{let sc=0;f.keys.forEach(k=>{if(t.includes(k))sc+=k.length});if(sc>bs){bs=sc;best=f}});return best?{text:best.a}:null},
  say(text,me,extra){this.hist.push({text,me,extra});this.draw()},
  draw(){const log=$('#chat-log');if(!log)return;log.innerHTML=this.hist.map(m=>`<div class="msg ${m.me?'me':'bot'}">${esc(m.text)}${m.extra||''}</div>`).join('');log.scrollTop=log.scrollHeight},
  ask(q){q=q.trim();if(!q)return;this.say(q,true);this.last=q;const a=this.answer(q);
    if(a){this.say(a.text,false);if(a.next&&a.next.length)this.chips(a.next.map(n=>n.q||n.title))}
    else this.say(T('bot.unknown'),false,`<div class="row" style="margin-top:8px"><button class="btn sm" data-act="botReport">${T('bot.report')}</button>${S.cfg.help.contact?'':''}</div>`)},
  chips(list){const c=$('#chat-q');if(c)c.innerHTML=list.map(x=>`<button class="chip" data-act="botQ" data-q="${esc(x)}">${esc(x)}</button>`).join('')},
  mount(){S.cfg=normCfg(S.cfg);let r=$('#chat-root');if(!r){r=document.createElement('div');r.id='chat-root';document.body.appendChild(r)}
    if(!S.user||S.cfg.help.enabled===false){r.innerHTML='';return}
    const botName=String(S.cfg.help.name||T('bot.title'));const icon=S.cfg.help.icon||S.cfg.help.iconUrl;const fab=`<button class="chat-fab" data-act="botToggle" aria-label="${esc(botName)}" aria-expanded="${this.open}">${icon?`<img src="${esc(icon)}" alt="">`:'🤖'}</button>`;
    if(!this.open){if(!$('.chat-fab',r)||r.dataset.o==='1'){r.innerHTML=fab;r.dataset.o='0'}return}
    if(r.dataset.o==='1')return;r.dataset.o='1';
    r.innerHTML=fab+`<section class="chat" role="dialog" aria-label="${esc(botName)}"><div class="chat-h"><span>${esc(botName)}</span><button data-act="botToggle" aria-label="${T('c.close')}">✕</button></div><div class="chat-log" id="chat-log" aria-live="polite"></div><div class="chat-q" id="chat-q"></div>
      <form class="chat-f" data-form="chat"><input type="text" id="chat-in" autocomplete="off" placeholder="${T('bot.ph')}" aria-label="${T('bot.ph')}"><button class="btn pri" type="submit">${T('c.send')}</button></form></section>`;
    if(!this.hist.length){this.say(T('bot.hello',{n:(S.user.name||'').split(' ')[0]}),false);}this.draw();this.chips(this.starters());setTimeout(()=>{const i=$('#chat-in');if(i)i.focus()},50)},
  starters(){const a=S.cfg.help.answers.slice(0,3).map(x=>x.q||x.title).filter(Boolean);return a.concat([T('bot.q.events'),T('bot.q.reserve'),T('bot.q.guide')]).slice(0,5)}};
Object.assign(ACT,{botToggle(){Bot.open=!Bot.open;const r=$('#chat-root');if(r)r.dataset.o=Bot.open?'0':'1';Bot.mount()},
  botQ(d){if(d.q===T('bot.q.guide')){Onboard.start(true);return}Bot.ask(d.q)},
  async botReport(){const ok=await Teams.send('chatbot_issue',{facts:[[T('tm.f.who'),S.user.name],[T('tm.f.question'),Bot.last],[T('tm.f.role'),T(ROLE_L[S.user.role])]]});audit('chatbot-issue','',Bot.last);Bot.say(ok||!S.teams.admin?T('bot.reported')+(S.cfg.help.contact?'\n'+S.cfg.help.contact:''):T('bot.reportFail')+(S.cfg.help.contact?'\n'+S.cfg.help.contact:''),false)}});

const Onboard={defaultSteps(all){const r=roleOf();const common=[{id:'welcome',role:'common',roleLabel:'Všichni',title:T('ob.welcome'),text:T('ob.welcomeT')},{id:'nav',role:'common',roleLabel:'Všichni',title:T('ob.nav'),text:T('ob.navT')}];const role={applicant:[{id:'a1',role:'applicant',roleLabel:'Žadatel',title:T('ob.a1'),text:T('ob.a1T')},{id:'a2',role:'applicant',roleLabel:'Žadatel',title:T('ob.a2'),text:T('ob.a2T')}],manager:[{id:'m1',role:'manager',roleLabel:'Nadřízený',title:T('ob.m1'),text:T('ob.m1T')},{id:'m2',role:'manager',roleLabel:'Nadřízený',title:T('ob.m2'),text:T('ob.m2T')}],rsm_praha:[{id:'r1',role:'rsm_praha',roleLabel:'RSM Praha',title:T('ob.r1'),text:T('ob.r1T')},{id:'rsm-m2',role:'rsm_praha',roleLabel:'RSM Praha',title:T('ob.m2'),text:T('ob.m2T')}],admin:[{id:'d1',role:'admin',roleLabel:'Administrátor',title:T('ob.d1'),text:T('ob.d1T')},{id:'d2',role:'admin',roleLabel:'Administrátor',title:T('ob.d2'),text:T('ob.d2T')},{id:'d3',role:'admin',roleLabel:'Administrátor',title:T('ob.d3'),text:T('ob.d3T')}]};return common.concat(all?Object.values(role).flat():(role[r]||[]),[{id:'helper',role:'common',roleLabel:'Všichni',title:T('ob.helper'),text:T('ob.helperT')}])},
  steps(){const ob=S.cfg.onboarding||{};return this.defaultSteps().map(st=>{const v=(ob.steps||{})[st.id]||{};return Object.assign({},st,{title:v.title!==undefined?v.title:st.title,text:v.text!==undefined?v.text:st.text,enabled:v.enabled!==false})}).filter(st=>st.enabled)},
  start(force){if(!S.user)return;const ob=S.cfg.onboarding||{};if(ob.enabled===false)return;const st=this.steps();if(!st.length)return;let i=0;const body=()=>`<h3>${esc(st[i].title)}</h3><p>${esc(st[i].text)}</p><div class="ob-dots">${st.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`;
    const d=dlg(T('ob.title'),body(),[{label:T('ob.skip'),fn:()=>{this.done()}},{label:T('c.back'),fn:dd=>{if(i>0){i--;$('.dlg-b',dd).innerHTML=body()}return false}},{label:T('ob.next'),cls:'pri',fn:dd=>{if(i<st.length-1){i++;$('.dlg-b',dd).innerHTML=body();if(i===st.length-1)$$('.dlg-f .btn',dd)[2].textContent=T('ob.finish');return false}this.done()}}],{noFocus:true})},
  done(){const u=S.user;if(!u||u.master){localStorage.setItem('ccOnb_'+(u&&u.email),'1');return}localStorage.setItem('ccOnb_'+u.email,'1');Auth.savePrefs({onboarded:true})},
  maybe(){const ob=S.cfg.onboarding||{};if(ob.enabled===false||ob.auto===false)return;const u=S.user;if(!u||!S.ready)return;const su=S.users[norm(u.email)];if(localStorage.getItem('ccOnb_'+u.email)||(su&&su.prefs&&su.prefs.onboarded))return;localStorage.setItem('ccOnb_'+u.email,'pending');setTimeout(()=>{if(!$('dialog[open]'))this.start()},600)}};

/* =====================================================================
   RENDER (jedna cesta, žádné další vrstvy) + události
   ===================================================================== */
let _rt=0,_dirty=false,_obChecked=false;
function changed(force){clearTimeout(_rt);_rt=setTimeout(()=>render(force),force?0:150)}
function render(force){const app=$('#app');if(!app)return;
  if(!force){const a=document.activeElement;if(a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!/^(checkbox|button|radio|file)$/.test(a.type||'')){_dirty=true;return}if($('dialog[open]')){_dirty=true;return}}
  _dirty=false;Auth.validateSession();applyTheme();const y=scrollY;
  if(!S.user){app.innerHTML=Views.gate();Bot.mount();return}
  let inner;switch(S.view){case 'reserve':inner=Views.reserve();break;case 'requests':inner=Views.requests();break;case 'dashboard':inner=Views.dashboard();break;case 'settings':inner=Views.settings();break;case 'admin':inner=isAdmin()?Admin.view():Views.events();if(!isAdmin())S.view='events';break;default:inner=Views.events();S.view='events'}
  app.innerHTML=Views.shell(inner);scrollTo(0,y);if(S.view==='admin')Admin.post();if(S.view==='requests'){const q=$('#rq-q');if(q)q.oninput=()=>{const v=norm(q.value);$$('#rq-table tbody tr').forEach(r=>r.classList.toggle('hide',!!v&&!r.dataset.q.includes(v)))}}
  if(S.view==='reserve')bindReserve();Bot.mount();if(S.ready&&!_obChecked){_obChecked=true;Onboard.maybe();Sched.start()}}
function bindReserve(){const ok=$('#x-ok'),b=$('#x-send');if(ok)ok.onchange=()=>{b.disabled=!ok.checked}}
document.addEventListener('mouseover',e=>{const b=e.target.closest('[data-act]');if(b&&!b.hasAttribute('data-tip')){const label=(b.innerText||b.getAttribute('aria-label')||b.title||'').trim();if(label)b.setAttribute('data-tip',label)}});
document.addEventListener('focusin',e=>{const b=e.target.closest('[data-act]');if(b&&!b.hasAttribute('data-tip')){const label=(b.innerText||b.getAttribute('aria-label')||b.title||'').trim();if(label)b.setAttribute('data-tip',label)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(!f)return;if(b.tagName==='A')e.preventDefault();try{const r=f(b.dataset,e);if(r&&r.catch)r.catch(x=>{toast(x.message,'err');logError('ui',x.message)})}catch(x){toast(x.message,'err');logError('ui',x.message)}});
document.addEventListener('focusout',()=>{if(_dirty)setTimeout(()=>{const a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))render()},250)});
document.addEventListener('submit',async e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const k=f.dataset.form,v=id=>($('#'+id,f)||{}).value||'';const btn=$('button[type=submit]',f);if(btn)btn.disabled=true;
  try{if(k==='settings'){const user=S.users[norm(S.user.email)];const old=v('st-old'),pw=v('st-pw'),pw2=v('st-pw2');if(pw||pw2||old){if(!old||!pw||pw.length<6||pw!==pw2)throw new Error('Pro změnu hesla zadejte současné heslo a nové heslo alespoň 6 znaků, dvakrát stejně.');if(!user||user.passwordHash!==hashPw(norm(S.user.email),old))throw new Error('Současné heslo není správné.');await Auth.setPassword(norm(S.user.email),pw)}const mgr=norm($('#st-mgr').value);if(mgr&&!Object.values(S.users).some(x=>norm(x.email)===mgr&&(x.role==='manager'||x.role==='rsm_praha')))throw new Error('Vyberte nadřízeného z nabídky registrovaných uživatelů.');await Cloud.mutate(d=>{const users=Object.assign({},d.users||{}),u=Object.assign({},users[norm(S.user.email)]||{}),prefs=Object.assign({},u.prefs||{},{managerEmail:norm(mgr)});u.prefs=prefs;users[norm(S.user.email)]=u;return{patch:{users}}});toast(T('c.saved'),'ok');render(true)}else if(k==='login'){await Auth.login(v('g-em'),v('g-pw'));S.view='events';render(true);Cloud.fresh()}
    else if(k==='adminCode'){await Auth.adminCode(v('a-c'));S.view='events';render(true)}
    else if(k==='register'){await Auth.register({name:v('r-n'),email:v('r-e'),role:v('r-r'),pw:v('r-p'),pw2:v('r-p2')});toast(T('gate.sent'),'ok');S.gateMode='login';render(true)}
    else if(k==='reserve'){const n=parseInt(v('x-n'));const rc=v('x-rs');const reason=(rc?rc+': ':'')+v('x-re').trim();if(!v('x-ev'))throw new Error(T('err.pickev'));if(!(n>=1&&n<=10))throw new Error(T('err.tickets'));
      await Res.create({eventId:v('x-ev'),employee:v('x-emp').trim(),manager:v('x-mgr'),customer:v('x-cu').trim(),tickets:n,reason});localStorage.setItem('ccLastMgr_'+norm(S.user.email),norm(v('x-mgr')));S.reserveEvent='';toast(T('rs.done'),'ok');S.view='requests';S.reqFilter='all';history.replaceState(null,'','#requests');render(true)}
    else if(k==='chat'){const i=$('#chat-in');const q=i.value;i.value='';Bot.ask(q)}}
  catch(err){toast(err.message||String(err),'err');if(!/^(Zadejte|Neplatn|Enter|Invalid|Incorrect)/.test(err.message||''))logError('form-'+k,err.message)}finally{if(btn&&document.body.contains(btn))btn.disabled=k==='reserve'&&$('#x-ok')&&!$('#x-ok').checked}});
addEventListener('online',()=>{S.net.online=true;changed(true);Cloud.fresh()});addEventListener('offline',()=>{S.net.online=false;changed(true)});
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(themePref()==='auto')render(true)});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['events','reserve','requests','dashboard','settings','admin'].includes(h)&&h!==S.view){S.view=h;render(true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&Bot.open&&!$('dialog[open]')){ACT.botToggle()}});

/* ---------- PWA ---------- */
function setupPWA(){if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  navigator.serviceWorker.register('sw.js').then(r=>{r.addEventListener('updatefound',()=>{const w=r.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast(T('pwa.update'),'ok')})})}).catch(e=>logError('sw',e.message));
  let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;S.canInstall=true;window.__install=()=>deferred.prompt()})}

/* ---------- start ---------- */
function boot(){S.lang=detectLang();cacheLoad();const h=location.hash.slice(1);if(['events','reserve','requests','dashboard','settings','admin'].includes(h))S.view=h;
  const hasFb=Cloud.init();applyTheme();render(true);
  if(hasFb){Cloud.listen();setTimeout(()=>{if(!S.ready){S.ready=true;changed(true)}},4000);
    Cloud.ref.get().then(()=>{S.ready=true;changed(true)}).catch(e=>{S.ready=true;logError('sync',e.message);changed(true)})}else{S.ready=true;toast(T('err.nofb'),'err')}
  setupPWA()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

</script>
