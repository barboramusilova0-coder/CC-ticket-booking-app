<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Rezervační portál lístků | Coca-Cola HBC</title>
  <style>
    :root {
      --cc-red: #e41e26;
      --cc-red-hover: #b81118;
      --cc-dark: #0f172a;
      --bg-light: #f8fafc;
      --border: #e2e8f0;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-light); margin: 0; color: #334155; }
    body::before { content: ''; display:block; height:6px; background: var(--cc-red); }
    .container { max-width: 1280px; margin: 0 auto; background:#fff; padding: 24px; border:1px solid var(--border); border-top:none; border-radius:0 0 16px 16px; }
    .welcome-gate { max-width:700px; margin: 40px auto; padding: 24px; background:#fff; border:1px solid var(--border); border-radius: 16px; text-align:center; }
    .brand-title { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .brand-logo { width:44px; height:44px; object-fit:contain; border-radius:8px; border:1px solid var(--border); background:#fff; }
    .brand-badge { background:var(--cc-red); color:#fff; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:700; }
    .tabs { display:flex; gap:8px; border-bottom: 1px solid var(--border); padding-bottom:10px; margin-bottom:16px; flex-wrap: wrap; }
    .tab-btn { border:none; background:#f1f5f9; padding:10px 14px; border-radius:8px; cursor:pointer; }
    .tab-btn.active { background:var(--cc-red); color:#fff; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    .btn { border:none; padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:600; }
    .btn-red { background: var(--cc-red); color:#fff; }
    .btn-dark { background: var(--cc-dark); color:#fff; }
    .btn-download { background:#0ea5e9; color:#fff; text-decoration:none; display:inline-block; }
    .input, select, textarea { width:100%; box-sizing:border-box; padding:10px 12px; margin-bottom:12px; border:1px solid #cbd5e1; border-radius:8px; }

    /* Onboarding */
    .onb-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 5000; display:none; }
    .onb-highlight { position: fixed; border: 3px solid #ff0000; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); z-index: 5001; pointer-events:none; display:none; }
    .onb-panel { position: fixed; right: 24px; bottom: 24px; width: 360px; max-width: calc(100vw - 24px); background:#fff; border:1px solid var(--border); border-radius:14px; z-index:5002; display:none; box-shadow:0 12px 40px rgba(0,0,0,.25); }
    .onb-head { display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); padding:12px; }
    .onb-avatar { width:36px; height:36px; border-radius:50%; background:#fee2e2; display:flex; align-items:center; justify-content:center; font-size:20px; }
    .onb-body { padding:12px; font-size:14px; line-height:1.4; }
    .onb-actions { display:flex; justify-content:space-between; padding:12px; border-top:1px solid var(--border); }
    .onb-actions button { border:none; border-radius:8px; padding:8px 12px; cursor:pointer; }
    .onb-actions .next { background:var(--cc-red); color:#fff; }

    .onb-picker { position: fixed; inset:0; display:none; z-index:5003; align-items:center; justify-content:center; background: rgba(0,0,0,.55); }
    .onb-picker-card { background:#fff; border-radius:14px; padding:18px; width:420px; max-width:calc(100vw - 24px); }
    .onb-picker-options { display:flex; gap:10px; }
    .onb-picker-options button { flex:1; border:1px solid var(--border); background:#fff; border-radius:10px; padding:12px; cursor:pointer; }

    .news-box { border:1px solid var(--border); background:#f8fafc; border-radius:10px; padding:12px; margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="welcome-gate" id="welcomeGate">
    <img id="ccLogoGate" class="brand-logo" alt="CC logo" src="https://upload.wikimedia.org/wikipedia/commons/c/ce/Coca-Cola_logo.svg" />
    <h1>Tickets booking app</h1>
    <p>Přihlaste se e-mailem a heslem.</p>
    <input id="gateUserToken" class="input" type="email" placeholder="E-mail" />
    <input id="gateUserPassword" class="input" type="password" placeholder="Heslo" />
    <button class="btn btn-red" onclick="loginUserFromGate()">Vstoupit do systému</button>
  </div>

  <div class="container" id="mainSystem" style="display:none;">
    <div class="brand-title">
      <img id="ccLogoMain" class="brand-logo" alt="CC logo" src="https://upload.wikimedia.org/wikipedia/commons/c/ce/Coca-Cola_logo.svg" />
      <h2 style="margin:0;">Systém rezervace lístků</h2>
      <span class="brand-badge">Coca-Cola HBC</span>
      <a id="downloadAppBtn" class="btn btn-download" href="./CC-ticket-booking-app.zip" download style="margin-left:auto;">⬇️ Stáhnout aplikaci</a>
      <button class="btn btn-dark" onclick="startOnboarding(true)">🧭 Spustit onboarding</button>
    </div>

    <div id="newsContainer" class="news-box" style="display:none;"></div>

    <div class="tabs">
      <button id="btn-nova" class="tab-btn active" onclick="openTab(1)">Nová rezervace</button>
      <button id="btn-seznam" class="tab-btn" onclick="openTab(2)">Seznam žádostí</button>
      <button id="btn-admin" class="tab-btn" onclick="openTab(3)">Administrace</button>
      <button id="btn-chatbot" class="tab-btn" onclick="openTab(4)">🤖 Chatbot</button>
    </div>

    <div id="tab1" class="tab-content active"><p>Obsah nové rezervace…</p></div>
    <div id="tab2" class="tab-content"><p>Obsah seznamu žádostí…</p></div>
    <div id="tab3" class="tab-content"><p>Obsah administrace…</p></div>
    <div id="tab4" class="tab-content"><p>Obsah chatbota…</p></div>
  </div>

  <div id="onbOverlay" class="onb-overlay"></div>
  <div id="onbHighlight" class="onb-highlight"></div>
  <div id="onbPanel" class="onb-panel">
    <div class="onb-head"><div id="onbAvatar" class="onb-avatar">👩</div><strong id="onbName">Průvodce</strong></div>
    <div id="onbText" class="onb-body"></div>
    <div class="onb-actions">
      <button onclick="endOnboarding()">Přeskočit</button>
      <button class="next" onclick="nextOnboardingStep()">Další</button>
    </div>
  </div>

  <div id="onbPicker" class="onb-picker">
    <div class="onb-picker-card">
      <h3>Vyber si pomocníka</h3>
      <p>Při prvním přihlášení si můžeš zvolit, kdo tě aplikací provede.</p>
      <div class="onb-picker-options">
        <button onclick="chooseAssistant('female')">👩 Žena</button>
        <button onclick="chooseAssistant('male')">👨 Muž</button>
      </div>
    </div>
  </div>

<script>
  let currentUser = null;
  function loginUserFromGate() {
    const email = document.getElementById('gateUserToken').value.trim();
    const pw = document.getElementById('gateUserPassword').value.trim();
    if (!email || !pw) { alert('Zadejte e-mail a heslo.'); return; }
    currentUser = { email: email, name: email.split('@')[0], role: 'applicant' };
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    document.getElementById('welcomeGate').style.display = 'none';
    document.getElementById('mainSystem').style.display = 'block';
    startOnboarding(false);
  }

  function openTab(num) {
    [1,2,3,4].forEach(i => {
      document.getElementById('tab'+i).classList.remove('active');
    });
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab'+num).classList.add('active');
    const ids = {1:'btn-nova',2:'btn-seznam',3:'btn-admin',4:'btn-chatbot'};
    document.getElementById(ids[num]).classList.add('active');
  }

  const defaultNews = [
    { id: 1, title: 'Novinka', text: 'Tady se budou zobrazovat novinky z administrace.', active: true }
  ];

  function getNews() {
    try {
      const n = JSON.parse(localStorage.getItem('onboardingNews') || 'null');
      return Array.isArray(n) ? n : defaultNews;
    } catch { return defaultNews; }
  }

  function renderNews() {
    const box = document.getElementById('newsContainer');
    const active = getNews().filter(n => n.active);
    if (!active.length) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    box.innerHTML = '<strong>🆕 Novinky</strong><ul>' + active.map(n => `<li><b>${n.title}:</b> ${n.text}</li>`).join('') + '</ul>';
  }

  const guides = {
    female: { name: 'Klára', avatar: '👩' },
    male: { name: 'Petr', avatar: '👨' }
  };

  let onbStep = 0;
  let onbSteps = [];
  let onbGuide = guides.female;

  function getRectFor(selector) {
    const el = document.querySelector(selector);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return { top: r.top - 6, left: r.left - 6, width: r.width + 12, height: r.height + 12 };
  }

  function applyHighlight(selector) {
    const h = document.getElementById('onbHighlight');
    const r = getRectFor(selector);
    if (!r) { h.style.display = 'none'; return; }
    h.style.display = 'block';
    h.style.top = r.top + 'px';
    h.style.left = r.left + 'px';
    h.style.width = r.width + 'px';
    h.style.height = r.height + 'px';
  }

  function buildSteps() {
    onbSteps = [
      { selector: '.brand-title', text: 'Tady vidíš hlavičku aplikace a hlavní ovládání.' },
      { selector: '#downloadAppBtn', text: 'Zde si můžeš stáhnout aplikaci.' },
      { selector: '.tabs', text: 'Tady jsou záložky pro navigaci v systému.' },
      { selector: '#btn-chatbot', text: 'Tady je chatbot, který poradí s používáním.' },
      { selector: '#newsContainer', text: 'Zde se zobrazují novinky, které nastavíš v administraci.' }
    ];
  }

  function showOnboardingStep() {
    if (onbStep >= onbSteps.length) { endOnboarding(); return; }
    const s = onbSteps[onbStep];
    document.getElementById('onbText').textContent = s.text;
    applyHighlight(s.selector);
  }

  function nextOnboardingStep() {
    onbStep += 1;
    showOnboardingStep();
  }

  function endOnboarding() {
    document.getElementById('onbOverlay').style.display = 'none';
    document.getElementById('onbPanel').style.display = 'none';
    document.getElementById('onbHighlight').style.display = 'none';
    localStorage.setItem('onboardingDone', '1');
  }

  function chooseAssistant(type) {
    onbGuide = guides[type] || guides.female;
    localStorage.setItem('onboardingAssistant', type);
    document.getElementById('onbPicker').style.display = 'none';
    launchOnboarding();
  }

  function launchOnboarding() {
    document.getElementById('onbAvatar').textContent = onbGuide.avatar;
    document.getElementById('onbName').textContent = onbGuide.name;
    document.getElementById('onbOverlay').style.display = 'block';
    document.getElementById('onbPanel').style.display = 'block';
    onbStep = 0;
    buildSteps();
    showOnboardingStep();
  }

  function startOnboarding(force) {
    renderNews();
    const done = localStorage.getItem('onboardingDone') === '1';
    const selected = localStorage.getItem('onboardingAssistant');
    if (!force && done) return;
    if (!selected) {
      document.getElementById('onbPicker').style.display = 'flex';
      return;
    }
    onbGuide = guides[selected] || guides.female;
    launchOnboarding();
  }

  (function init() {
    const saved = localStorage.getItem('currentUser');
    if (saved) {
      currentUser = JSON.parse(saved);
      document.getElementById('welcomeGate').style.display = 'none';
      document.getElementById('mainSystem').style.display = 'block';
      renderNews();
    }
  })();
</script>
</body>
</html>
